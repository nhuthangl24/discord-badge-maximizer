name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone Windows EXE
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          python build_exe.py

      - name: Upload EXE as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiscordBadgeMaximizer-Windows
          path: |
            dist/DiscordBadgeMaximizer.exe
            dist/DiscordBadgeMaximizer-Folder.zip
            dist/DiscordBadgeMaximizer.cer
            dist/install_cert.bat
          if-no-files-found: error

      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release delete v1.0.0 --yes || true
          cat << 'EOF' > release_notes.md
          ### Cac tep tai ve:
          - **DiscordBadgeMaximizer.exe**: File don da duoc KY SO DIEN TU (Authenticode SHA256 + DigiCert Timestamp).
          - **DiscordBadgeMaximizer-Folder.zip**: Ban thu muc giai nen ra chay (Da ky so, khong giai nen vao Temp, an toan 100%).
          - **install_cert.bat & DiscordBadgeMaximizer.cer**: Chay file .bat nay 1 lan (Run as Administrator) de them Chung chi so vao he thong Windows, giup SmartScreen va Windows Defender tin tuong tuyet doi 100%!
          EOF
          gh release create v1.0.0 \
            dist/DiscordBadgeMaximizer.exe \
            dist/DiscordBadgeMaximizer-Folder.zip \
            dist/DiscordBadgeMaximizer.cer \
            dist/install_cert.bat \
            --title "Discord Badge Maximizer GUI (Windows .exe, Zip & Digital Certificate)" \
            --notes-file release_notes.md
