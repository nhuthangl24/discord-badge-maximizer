name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone Windows EXE
        run: |
          python build_exe.py

      - name: Upload EXE as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiscordBadgeMaximizer-Windows
          path: dist/DiscordBadgeMaximizer.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: latest-release
          name: "Discord Badge Maximizer GUI (Windows .exe)"
          body: |
            ## ⚡ Discord Badge Maximizer - Bản GUI cho Windows (.exe)
            
            - **Giao diện đồ họa (GUI) hiện đại**, thiết kế chuẩn Dark Theme Discord.
            - **Live Stream 24/7 (Streaming Badge)**: Tự động phát video, auto-resilience 24/7 không ngắt kết nối.
            - **Cày Giờ Chơi Game (Gamer Badge)**: Tùy chọn số lượng game và số giờ cho mỗi game.
            - **Kho bảo mật Token Vault**: Mã hóa 2 lớp TripleDES + AES-256 an toàn.
            
            ### 📥 Hướng dẫn tải & sử dụng:
            1. Tải file `DiscordBadgeMaximizer.exe` đính kèm bên dưới.
            2. Nhấp đúp chuột vào file `DiscordBadgeMaximizer.exe` để mở giao diện GUI.
            3. Dán Token Discord của bạn và bấm **🔴 Bắt Đầu Stream** hoặc **🚀 Bắt Đầu Cày Game**!
          files: dist/DiscordBadgeMaximizer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
