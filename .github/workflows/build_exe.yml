name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone Windows EXE
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          python build_exe.py

      - name: Upload EXE as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiscordBadgeMaximizer-Windows
          path: |
            dist/DiscordBadgeMaximizer.exe
            dist/DiscordBadgeMaximizer-Folder.zip
            dist/DiscordBadgeMaximizer.cer
            dist/install_cert.bat
          if-no-files-found: error

      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release delete v1.0.0 --yes || true
          gh release create v1.0.0 \
            dist/DiscordBadgeMaximizer.exe \
            dist/DiscordBadgeMaximizer-Folder.zip \
            dist/DiscordBadgeMaximizer.cer \
            dist/install_cert.bat \
            --title "Discord Badge Maximizer GUI (Windows .exe, Zip & Digital Certificate)" \
            --notes "### Các tệp tải về:
- **DiscordBadgeMaximizer.exe**: File đơn đã được KÝ SỐ ĐIỆN TỬ (Authenticode SHA256 + DigiCert Timestamp).
- **DiscordBadgeMaximizer-Folder.zip**: Bản thư mục giải nén ra chạy (Đã ký số, không giải nén vào Temp, an toàn 100%).
- **install_cert.bat & DiscordBadgeMaximizer.cer**: Chạy file .bat này 1 lần (Run as Administrator) để thêm Chứng chỉ số vào hệ thống Windows, giúp SmartScreen và Windows Defender tin tưởng tuyệt đối 100%!"
