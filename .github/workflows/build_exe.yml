name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies & Inno Setup
        run: |
          choco install innosetup --no-progress -y
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone Windows EXE & Setup Installer
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          python build_exe.py

      - name: Upload EXE as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiscordBadgeMaximizer-Windows
          path: |
            dist/DiscordBadgeMaximizer-Setup.exe
            dist/DiscordBadgeMaximizer.exe
            dist/DiscordBadgeMaximizer-Folder.zip
            dist/DiscordBadgeMaximizer.cer
            dist/install_cert.bat
          if-no-files-found: error

      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release delete v1.0.0 --yes || true
          cat << 'EOF' > release_notes.md
          ### Cac tep tai ve:
          - **DiscordBadgeMaximizer-Setup.exe**: Trinh cai dat Installer chuan Windows (Tu tao shortcut Desktop, Start Menu, chay ung dung GUI 100% khong kem bat ky terminal nao).
          - **DiscordBadgeMaximizer.exe**: File don portable chay ngay.
          - **DiscordBadgeMaximizer-Folder.zip**: Ban thu muc zip giai nen ra chay.
          - **install_cert.bat & DiscordBadgeMaximizer.cer**: Them chung chi so de Windows tin tuong tuyet doi.
          EOF
          gh release create v1.0.0 \
            dist/DiscordBadgeMaximizer-Setup.exe \
            dist/DiscordBadgeMaximizer.exe \
            dist/DiscordBadgeMaximizer-Folder.zip \
            dist/DiscordBadgeMaximizer.cer \
            dist/install_cert.bat \
            --title "Discord Badge Maximizer GUI (Windows Setup Installer & Portable)" \
            --notes-file release_notes.md
