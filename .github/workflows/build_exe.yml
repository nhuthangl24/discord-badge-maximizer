name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone Windows EXE
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          python build_exe.py

      - name: Upload EXE as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiscordBadgeMaximizer-Windows
          path: dist/DiscordBadgeMaximizer.exe
          if-no-files-found: error

      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create v1.0.0 dist/DiscordBadgeMaximizer.exe \
            --title "Discord Badge Maximizer GUI (Windows .exe)" \
            --notes "Nhấp tải file DiscordBadgeMaximizer.exe đính kèm bên dưới để mở giao diện GUI trên Windows!" \
            --clobber || gh release upload v1.0.0 dist/DiscordBadgeMaximizer.exe --clobber
